<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THWL</title>
    <link rel="stylesheet" href="../design/design.css">
</head>
<body>
<header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <h1>문의사항 관리</h1>
                <!-- <span class="badge">INQUIRY</span> -->
            </div>
            <nav>
                <a href="../index.html">대시보드</a>
                <a class="active" href="../pages/SaveInquiry.html">문의 관리</a>
                <a href="../pages/SaveDeploy.html">개발·배포 관리</a>
                <a href="../pages/SaveDataRequest.html">데이터 처리 요청</a>
                <a href="../pages/SaveCheckList.html">체크리스트</a>
                <a href="../pages/SaveSetting.html">JSON 설정</a>
            </nav>
            <div class="actions">
                <!-- <button class="btn secondary" data-load-json="inquiries">JSON 불러오기</button>
                <input type="file" accept=".json,application/json" data-json-input="inquiries" hidden>
                <button class="btn secondary" data-connect-json="inquiries">JSON 파일 연결</button>
                <button class="btn secondary" data-save-json="inquiries">JSON 저장</button> -->
                <button class="btn secondary" data-save-html>오늘 날짜 HTML 저장</button>
                <button class="btn primary" id="addInquiry">+ 문의 등록</button></div>
        </div>
    </header>
    <main class="container">
        <section class="page-intro">
            <div>
                <p class="eyebrow">CUSTOMER INQUIRIES</p>
                <h2>문의 내역</h2>
                <p>문의 접수부터 처리 완료까지의 이력을 관리합니다.</p>
            </div>
        </section>

        <section class="kpis">
            <div class="kpi"><small>전체 문의</small><strong id="qTotal">0</strong></div>
            <div class="kpi"><small>처리 대기</small><strong class="warning" id="qPending">0</strong></div>
            <div class="kpi"><small>처리 완료</small><strong class="success" id="qDone">0</strong></div>
            <div class="kpi"><small>문의 병원 수</small><strong id="qHospitals">0</strong></div>
        </section>

        <section class="panel">
            <div class="toolbar">
                <div class="tabs">
                    <button class="tab active" data-filter="all">전체 <b id="qAllN">0</b></button>
                    <button class="tab" data-filter="pending">미완료 <b id="qPendingN">0</b></button>
                    <button class="tab" data-filter="done">완료 <b id="qDoneN">0</b></button>
                </div>
                <div class="filters">
                    <select id="qHospital"><option value="">전체 병원</option></select>
                    <input id="qSearch" type="search" placeholder="병원, 문의자, 내용 검색">
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th><th>완료여부</th><th>문의병원</th><th>문의자</th>
                            <th>문의내용</th><th>처리내용</th><th>문의일자</th><th>처리일자</th><th>첨부 이미지</th><th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="qRows"></tbody>
                </table>
            </div>
            <div class="empty" id="qEmpty" hidden>등록된 문의사항이 없습니다.</div>
        </section>
    </main>

    <div class="backdrop" id="qModal">
        <section class="modal">
            <div class="modal-head">
                <h2 id="qModalTitle">문의 등록</h2>
                <button class="btn secondary small" id="qClose">닫기</button>
            </div>
            <form id="qForm">
                <div class="modal-body">
                    <input id="qId" type="hidden">
                    <div class="form-grid">
                        <label>문의병원 *<input id="qHospitalField" required></label>
                        <label>문의자 *<input id="qRequester" required></label>
                    </div>
                    <label>문의내용 *<textarea id="qContent" required></textarea></label>
                    <label>처리내용<textarea id="qAnswer"></textarea></label>
                    <div class="form-grid">
                        <label>문의일자 *<input id="qDate" type="date" required></label>
                        <label>처리일자<input id="qProcessDate" type="date"></label>
                    </div>
                    <label class="check"><input id="qCompleted" type="checkbox"> 처리 완료</label>
                    <fieldset><legend>문의별 이미지 첨부</legend><label>이미지 파일<input type="file" id="qImages" accept="image/*" multiple></label><small class="muted">현재 문의 항목에 개별 첨부됩니다. 이미지당 최대 1.5MB, 항목당 최대 5장입니다.</small><div id="qImagePreview" class="checklist-image-preview"></div></fieldset>
                </div>
                <div class="modal-foot">
                    <button class="btn secondary" type="button" id="qCancel">취소</button>
                    <button class="btn primary" type="submit">저장</button>
                </div>
            </form>
        </section>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../biz/common.js"></script>
    <script src="../biz/inquiry.js"></script>
</body>
</html>
