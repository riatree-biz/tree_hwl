<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발 및 배포 작업일지</title><link rel="stylesheet" href="design.css"></head>
<body><header class="app-header"><div class="header-inner"><div class="brand"><h1>개발 및 배포 작업일지</h1><span class="badge">● LOCAL WORKSPACE</span></div><nav><a href="index.html">대시보드</a><a href="inquiry.html">문의 관리</a><a class="active" href="deploy.html">개발·배포 관리</a></nav><div class="actions"><button class="btn secondary" id="exportCsv">CSV 내보내기</button><button class="btn secondary" data-save-json>data.json 저장</button><button class="btn secondary" data-save-html>오늘 날짜 HTML 저장</button><button class="btn primary" id="addDeploy">+ 새 작업 등록</button></div></div></header>
<main class="container"><section class="kpis"><div class="kpi"><small>전체 등록 건수</small><strong id="dTotal">0</strong></div><div class="kpi"><small>배포 대기</small><strong class="warning" id="dPending">0</strong></div><div class="kpi"><small>배포 완료</small><strong class="success" id="dDone">0</strong></div><div class="kpi"><small>등록 병원 수</small><strong id="dHospitals">0</strong></div></section>
<section class="panel"><div class="toolbar"><div class="tabs"><button class="tab active" data-tab="all">전체 내역 <b id="dAllN">0</b></button><button class="tab" data-tab="pending">배포 대기 <b id="dPendingN">0</b></button><button class="tab" data-tab="deployed">배포 완료 <b id="dDoneN">0</b></button></div><div class="filters"><select id="dHospital"><option value="">전체 병원</option></select><select id="dCategory"><option value="">전체 구분</option><option>DB</option><option>FE</option><option>BE</option><option>INFRA</option><option>ETC</option></select><input id="dSearch" type="search" placeholder="병원, 요청자, 내용, 변경소스 검색"></div></div>
<div class="table-wrap"><table><thead><tr><th>인덱스</th><th>상태</th><th>요청병원</th><th>요청자</th><th>구분</th><th>요청내용</th><th>개발내용</th><th>변경 소스</th><th>요청일자</th><th>개발일자</th><th>완료일자</th><th>배포일자</th><th>관리</th></tr></thead><tbody id="dRows"></tbody></table></div><div class="empty" id="dEmpty" hidden>조건에 해당하는 작업 내역이 없습니다.</div></section></main>
<div class="backdrop" id="dModal"><section class="modal wide"><div class="modal-head"><h2 id="dModalTitle">새 작업 등록</h2><button class="btn secondary small" id="dClose">닫기</button></div><form id="dForm"><div class="modal-body"><input id="dId" type="hidden"><div class="form-grid"><label>인덱스<input id="dIndex" readonly></label><fieldset><legend>구분 (중복 선택 가능) *</legend><div class="checks"><label class="check"><input type="checkbox" name="category" value="DB">DB</label><label class="check"><input type="checkbox" name="category" value="FE">FE</label><label class="check"><input type="checkbox" name="category" value="BE">BE</label><label class="check"><input type="checkbox" name="category" value="INFRA">INFRA</label><label class="check"><input type="checkbox" name="category" value="ETC">ETC</label></div></fieldset></div><div class="form-grid"><label>요청병원 *<input id="dHospitalField" required></label><label>요청자 *<input id="dRequester" required></label></div><label>요청내용 *<textarea id="dRequest" required></textarea></label><label>개발내용<textarea id="dDevelopment"></textarea></label><label>변경 소스<textarea id="dSource" class="mono"></textarea></label><div class="form-grid four"><label>요청일자 *<input id="dRequestDate" type="date" required></label><label>개발일자<input id="dDevDate" type="date"></label><label>완료일자<input id="dCompleteDate" type="date"></label><label>배포일자<input id="dDeployDate" type="date"></label></div></div><div class="modal-foot"><button class="btn secondary" type="button" id="dCancel">취소</button><button class="btn primary" type="submit">저장</button></div></form></section></div><div class="toast" id="dToast"></div>
<script src="common.js"></script><script src="deploy.js"></script></body></html>
