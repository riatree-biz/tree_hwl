<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의사항 관리</title><link rel="stylesheet" href="design.css"></head>
<body><header class="app-header"><div class="header-inner"><div class="brand"><h1>문의사항 관리</h1><span class="badge">● INQUIRY</span></div><nav><a href="index.html">대시보드</a><a class="active" href="inquiry.html">문의 관리</a><a href="deploy.html">개발·배포 관리</a></nav><div class="actions"><button class="btn secondary" data-save-json>data.json 저장</button><button class="btn secondary" data-save-html>오늘 날짜 HTML 저장</button><button class="btn primary" id="addInquiry">+ 문의 등록</button></div></div></header>
<main class="container"><section class="kpis"><div class="kpi"><small>전체 문의</small><strong id="qTotal">0</strong></div><div class="kpi"><small>처리 대기</small><strong class="warning" id="qPending">0</strong></div><div class="kpi"><small>처리 완료</small><strong class="success" id="qDone">0</strong></div><div class="kpi"><small>문의 병원 수</small><strong id="qHospitals">0</strong></div></section>
<section class="panel"><div class="toolbar"><div class="tabs"><button class="tab active" data-filter="all">전체 <b id="qAllN">0</b></button><button class="tab" data-filter="pending">미완료 <b id="qPendingN">0</b></button><button class="tab" data-filter="done">완료 <b id="qDoneN">0</b></button></div><div class="filters"><select id="qHospital"><option value="">전체 병원</option></select><input id="qSearch" type="search" placeholder="병원, 문의자, 내용 검색"></div></div>
<div class="table-wrap"><table><thead><tr><th>No.</th><th>완료여부</th><th>문의병원</th><th>문의자</th><th>문의내용</th><th>처리내용</th><th>문의일자</th><th>처리일자</th><th>관리</th></tr></thead><tbody id="qRows"></tbody></table></div><div class="empty" id="qEmpty" hidden>등록된 문의사항이 없습니다.</div></section></main>
<div class="backdrop" id="qModal"><section class="modal"><div class="modal-head"><h2 id="qModalTitle">문의 등록</h2><button class="btn secondary small" id="qClose">닫기</button></div><form id="qForm"><div class="modal-body"><input id="qId" type="hidden"><div class="form-grid"><label>문의병원 *<input id="qHospitalField" required></label><label>문의자 *<input id="qRequester" required></label></div><label>문의내용 *<textarea id="qContent" required></textarea></label><label>처리내용<textarea id="qAnswer"></textarea></label><div class="form-grid"><label>문의일자 *<input id="qDate" type="date" required></label><label>처리일자<input id="qProcessDate" type="date"></label></div><label class="check"><input id="qCompleted" type="checkbox"> 처리 완료</label></div><div class="modal-foot"><button class="btn secondary" type="button" id="qCancel">취소</button><button class="btn primary" type="submit">저장</button></div></form></section></div><div class="toast" id="toast"></div>
<script src="common.js"></script><script src="inquiry.js"></script></body></html>
